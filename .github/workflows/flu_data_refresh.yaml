name: Refresh flu data (weekly)
on:
  schedule:
    - cron: "0 17 * * 6"   # Mondays ~09:00 PT (16:00 UTC; shifts 1h with DST)
  workflow_dispatch:        # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/refresh_flu_data.py
      - name: Commit data.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Weekly flu data refresh"
          git push
