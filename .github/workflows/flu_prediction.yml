# .github/workflows/flu_prediction.yml
# Automated CDC Flu Prediction Pipeline — weekly email report

name: CDC Flu Prediction

on:
  # Run every Monday at 8 AM PST / 9 AM PDT (4 PM UTC)
  schedule:
    - cron: '0 16 * * 1'

  # Allow manual trigger
  workflow_dispatch:

  # Run tests on code changes (no email is sent from these runs)
  push:
    branches:
      - main
    paths:
      - 'cdc_flu_pipeline.py'
      - 'test.py'
      - 'requirements.txt'
      - '.github/workflows/flu_prediction.yml'
  pull_request:

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🧪 Run unit tests
      run: pytest test.py -v

  predict-flu-activity:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🏥 Run flu prediction pipeline
      id: predict
      env:
        STATE: ${{ secrets.STATE || 'California' }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
        SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
        EXCEED_THRESHOLD: ${{ secrets.EXCEED_THRESHOLD || '0.03' }}
      run: |
        python cdc_flu_pipeline.py

    - name: 💾 Persist prediction state
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add state/last_prediction.json
        if git diff --cached --quiet; then
          echo "No state changes to commit"
        else
          git commit -m "chore: update flu prediction state"
          git push
        fi

    - name: 📊 Upload prediction artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: flu-prediction-${{ github.run_number }}
        path: |
          output/prediction.csv
          output/forecast_plot.png
          output/weekly_plot.png
          output/summary.txt
        if-no-files-found: warn
        retention-days: 90

    - name: 📝 Create job summary
      if: always()
      run: |
        echo "## 🏥 CDC Flu Prediction Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Run Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f "output/summary.txt" ]; then
          echo "### 📋 Prediction Summary" >> $GITHUB_STEP_SUMMARY
          echo '~~~' >> $GITHUB_STEP_SUMMARY
          cat output/summary.txt >> $GITHUB_STEP_SUMMARY
          echo '~~~' >> $GITHUB_STEP_SUMMARY
        fi

        if [ -f "output/prediction.csv" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Prediction Data" >> $GITHUB_STEP_SUMMARY
          echo '~~~csv' >> $GITHUB_STEP_SUMMARY
          cat output/prediction.csv >> $GITHUB_STEP_SUMMARY
          echo '~~~' >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📈 Visualization" >> $GITHUB_STEP_SUMMARY
        echo "See artifacts for the forecast and weekly charts" >> $GITHUB_STEP_SUMMARY

    - name: 🚨 Create issue when latest week exceeds prediction
      if: steps.predict.outputs.exceed_alert == 'true'
      uses: actions/github-script@v7
      env:
        STATE: ${{ secrets.STATE || 'California' }}
      with:
        script: |
          const lastWeek = '${{ steps.predict.outputs.last_week }}';
          const actual = '${{ steps.predict.outputs.last_actual }}';
          const predicted = '${{ steps.predict.outputs.last_predicted }}';
          const pct = '${{ steps.predict.outputs.pct_above }}';
          const state = process.env.STATE;

          const body = [
            '## Flu Activity Alert - ' + state,
            '',
            '**Alert Generated:** ' + new Date().toISOString(),
            '',
            '### ⚠️ Latest Week Exceeded Prediction by >3%',
            '',
            '- **Week Starting:** ' + lastWeek,
            '- **Actual Cases:** ' + actual,
            '- **Predicted Volume:** ' + predicted,
            '- **Excess:** +' + pct + '%',
            '',
            'The weekly email report includes a chart with a red line flagging this overage.',
            '',
            'View the [workflow run](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ') for details and artifacts.',
            '',
            '---',
            '*This issue was automatically created by the CDC Flu Prediction Pipeline*'
          ].join('\n');

          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🚨 Flu Alert: latest week ' + pct + '% above prediction (' + actual + ' cases)',
            body: body,
            labels: ['alert', 'flu-prediction', 'automated']
          })

    - name: ❌ Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const body = [
            '## Pipeline Failure',
            '',
            '**Failed At:** ' + new Date().toISOString(),
            '**Workflow:** ' + context.workflow,
            '**Run ID:** ' + context.runId,
            '',
            '### Error Details',
            '',
            'The automated flu prediction pipeline encountered an error.',
            '',
            '**Possible causes:**',
            '- CDC API unavailable',
            '- Network connectivity issues',
            '- Model training failure',
            '- Email configuration error',
            '',
            '### 🔍 Debug Steps',
            '',
            '1. Check the [workflow logs](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ')',
            '2. Verify CDC API status: https://data.cdc.gov/',
            '3. Confirm GitHub Secrets are configured correctly',
            '4. Review recent code changes',
            '',
            '### 📧 Required Secrets',
            '',
            'Ensure these secrets are configured in repository settings:',
            '- EMAIL_SENDER',
            '- EMAIL_PASSWORD',
            '- EMAIL_RECIPIENTS',
            '',
            '---',
            '*This issue was automatically created by the CDC Flu Prediction Pipeline*'
          ].join('\n');

          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '❌ Flu Prediction Pipeline Failed',
            body: body,
            labels: ['bug', 'pipeline-failure', 'automated']
          })
